services:
  - type: web
    name: second-grade-math-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: jkyfx
      - key: ADMIN_PASSWORD
        value: wangkun
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://wangk565.github.io
