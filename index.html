<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数学小课堂 · 学生管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#FFF8F3;
    --surface:#FFFFFF;
    --surface-2:#FFFDFA;
    --primary:#FF8A65;
    --primary-dark:#E8643F;
    --primary-soft:#FFE3D6;
    --yellow:#FFC83D;
    --yellow-soft:#FFF1CC;
    --mint:#5FB85F;
    --mint-soft:#D7EFD7;
    --sky:#4FB6F5;
    --sky-soft:#D6EBFB;
    --purple:#B078DE;
    --purple-soft:#ECDDF6;
    --text:#4A3F38;
    --text-muted:#9A8A7D;
    --text-light:#B8A99C;
    --border:#F1E6D8;
    --border-strong:#E6D6C3;
    --shadow:0 4px 14px rgba(180,140,100,.08);
    --shadow-lg:0 14px 36px rgba(180,140,100,.14);
    --radius:20px;
    --radius-sm:12px;
    --radius-lg:26px;
    --sidebar-w:232px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans SC','Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#E6D6C3;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#D6C2AA}

  /* ===== App shell ===== */
  #app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:linear-gradient(180deg,#FFF3EA 0%,#FFE9DC 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
  .brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary) 0%,#FFA478 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(255,138,101,.35);flex-shrink:0}
  .brand-logo svg{width:24px;height:24px}
  .brand-text .brand-name{font-weight:900;font-size:16px;letter-spacing:.3px}
  .brand-text .brand-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--text-muted);font-weight:500;font-size:14px;transition:all .18s ease;width:100%;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.6);color:var(--text)}
  .nav-item.active{background:#fff;color:var(--primary-dark);font-weight:700;box-shadow:0 4px 12px rgba(180,140,100,.08)}
  .nav-item .nav-ico{width:20px;height:20px;flex-shrink:0}
  .teacher-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 12px;border:1px solid rgba(255,255,255,.8)}
  .teacher-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFD54F,#FF8A65);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0}
  .teacher-info .t-name{font-weight:700;font-size:13px}
  .teacher-info .t-sub{font-size:11px;color:var(--text-muted)}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--bg)}
  .page-title{font-size:22px;font-weight:900;letter-spacing:.2px}
  .page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
  .topbar-left{display:flex;align-items:center;gap:16px}
  .topbar-actions{display:flex;gap:10px;align-items:center}

  .content{flex:1;overflow-y:auto;padding:24px 32px 40px}

  /* ===== Buttons ===== */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;font-weight:600;font-size:13px;transition:all .18s ease;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(255,138,101,.32)}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border-strong)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-soft{background:var(--primary-soft);color:var(--primary-dark)}
  .btn-soft:hover{background:#FFD3C0}
  .btn-danger{background:#FFE0DC;color:#D9544A}
  .btn-danger:hover{background:#FFCFC7}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}
  .btn-icon{padding:8px;border-radius:10px;background:transparent;color:var(--text-muted)}
  .btn-icon:hover{background:var(--surface-2);color:var(--text)}

  /* ===== Cards ===== */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
  .card-pad{padding:22px}

  /* Stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
  .stat-card{border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow)}
  .stat-card.coral{background:linear-gradient(135deg,#FFF1EA 0%,#FFE3D6 100%)}
  .stat-card.yellow{background:linear-gradient(135deg,#FFF7DD 0%,#FFEFC4 100%)}
  .stat-card.mint{background:linear-gradient(135deg,#EBF7EB 0%,#D7EFD7 100%)}
  .stat-card.sky{background:linear-gradient(135deg,#E9F5FE 0%,#D6EBFB 100%)}
  .stat-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .stat-ico svg{width:22px;height:22px}
  .stat-card.coral .stat-ico{background:var(--primary);color:#fff}
  .stat-card.yellow .stat-ico{background:var(--yellow);color:#7A5400}
  .stat-card.mint .stat-ico{background:var(--mint);color:#fff}
  .stat-card.sky .stat-ico{background:var(--sky);color:#fff}
  .stat-label{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:4px}
  .stat-value{font-size:28px;font-weight:900;letter-spacing:-.5px}
  .stat-trend{font-size:11px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:4px}
  .stat-trend.up{color:var(--mint)}
  .stat-trend.flat{color:var(--text-muted)}

  /* Dashboard layout */
  .dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .section-title{font-size:16px;font-weight:700}
  .section-sub{font-size:12px;color:var(--text-muted)}
  .chart-box{position:relative;height:300px}

  .recent-list{display:flex;flex-direction:column;gap:10px}
  .recent-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;transition:background .15s}
  .recent-item:hover{background:var(--surface-2)}
  .recent-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
  .recent-body{flex:1;min-width:0}
  .recent-name{font-weight:600;font-size:13px}
  .recent-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent-time{font-size:11px;color:var(--text-light);flex-shrink:0}

  /* ===== Tables / lists ===== */
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .search-box{position:relative;flex:1;max-width:340px}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
  .search-box input{width:100%;padding:11px 14px 11px 40px;border-radius:14px;border:1px solid var(--border-strong);background:#fff}
  .search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

  .table{width:100%;border-collapse:separate;border-spacing:0 6px}
  .table th{text-align:left;font-size:12px;font-weight:600;color:var(--text-muted);padding:6px 14px}
  .table td{padding:12px 14px;background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .table tr td:first-child{border-left:1px solid var(--border);border-radius:14px 0 0 14px}
  .table tr td:last-child{border-right:1px solid var(--border);border-radius:0 14px 14px 0}
  .table tbody tr:hover td{background:var(--surface-2)}
  .stu-cell{display:flex;align-items:center;gap:12px}
  .stu-avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
  .stu-name{font-weight:600}
  .stu-name-link{cursor:pointer;color:var(--primary-dark);font-weight:700;text-decoration:underline;text-decoration-color:transparent;transition:all .15s}
  .stu-name-link:hover{text-decoration-color:var(--primary-dark)}
  .stu-id{font-size:11px;color:var(--text-muted)}
  .gender-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .gender-male{background:var(--sky-soft);color:#1A6FAA}
  .gender-female{background:var(--purple-soft);color:#7A4AAB}
  .points-badge{font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:4px 12px;border-radius:20px;font-size:13px;display:inline-block}
  .row-actions{display:flex;gap:4px;justify-content:flex-end}

  .empty{padding:50px 20px;text-align:center;color:var(--text-muted)}
  .empty-ico{width:56px;height:56px;margin:0 auto 14px;background:var(--surface-2);border-radius:18px;display:flex;align-items:center;justify-content:center}
  .empty-ico svg{width:28px;height:28px;color:var(--text-light)}

  /* ===== Forms / modals ===== */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background:rgba(74,63,56,.32);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .modal-head{padding:22px 26px 8px;display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-size:18px;font-weight:800}
  .modal-body{padding:8px 26px 20px;overflow-y:auto;flex:1}
  .modal-foot{padding:16px 26px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border)}
  .field{margin-bottom:16px}
  .field-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .field-label .req{color:var(--primary);margin-left:2px}
  .field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border-strong);background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field-hint{font-size:11px;color:var(--text-muted);margin-top:5px}

  /* Score entry grid */
  .score-grid{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
  .score-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--surface-2);border-radius:12px}
  .score-row .stu-avatar{width:32px;height:32px;font-size:13px;border-radius:10px}
  .score-row .sr-name{flex:1;font-weight:600;font-size:13px}
  .score-row .sr-input{padding:7px 10px;border-radius:10px;border:1px solid var(--border-strong);text-align:center;font-weight:700}
  .score-row select.sr-input{width:90px}
  .score-row .sr-input[type=number]{width:84px}
  .score-row .sr-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .score-row .sr-note{flex:1;max-width:160px;padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:12px}

  /* Record list */
  .record-list{display:flex;flex-direction:column;gap:12px}
  .record-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);transition:all .18s}
  .record-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .record-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .record-ico svg{width:22px;height:22px}
  .record-info{flex:1;min-width:0}
  .record-name{font-weight:700;font-size:15px}
  .record-meta{font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .record-stat{font-size:12px;font-weight:600;color:var(--text)}
  .record-stat b{font-size:15px;color:var(--primary-dark)}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:20px;width:fit-content;flex-wrap:wrap}
  .tab{padding:9px 18px;border-radius:10px;font-weight:600;font-size:13px;color:var(--text-muted);transition:all .15s}
  .tab.active{background:#fff;color:var(--primary-dark);box-shadow:0 2px 8px rgba(180,140,100,.1)}
  .tab:hover:not(.active){color:var(--text)}

  /* Charts grid */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chart-card{padding:20px}
  .chart-card .chart-box{height:260px}

  /* Toast */
  .toast-wrap{position:fixed;top:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
  .toast{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;border:1px solid var(--border);animation:slideIn .25s ease;min-width:240px}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .toast-ico{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .toast-ico svg{width:14px;height:14px}
  .toast.success .toast-ico{background:var(--mint)}
  .toast.error .toast-ico{background:#E85C4F}
  .toast.info .toast-ico{background:var(--sky)}
  .toast-msg{font-size:13px;font-weight:600}

  /* Filter chips */
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text-muted);transition:all .15s;cursor:pointer}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip:hover:not(.active){border-color:var(--primary);color:var(--primary-dark)}

  /* Class switcher */
  .class-switch{display:inline-flex;background:#fff;border:1px solid var(--border-strong);border-radius:14px;padding:4px;gap:4px;box-shadow:0 2px 8px rgba(180,140,100,.06)}
  .class-switch button{padding:8px 18px;border-radius:10px;font-weight:700;font-size:13px;color:var(--text-muted);transition:all .18s;display:flex;align-items:center;gap:6px}
  .class-switch button.active{background:linear-gradient(135deg,var(--primary),#FFA478);color:#fff;box-shadow:0 4px 10px rgba(255,138,101,.32)}
  .class-switch button .cls-badge{font-size:10px;opacity:.85;font-weight:500;padding:1px 6px;border-radius:20px}
  .class-switch button:not(.active) .cls-badge{background:var(--surface-2);color:var(--text-muted)}
  .class-switch button.active .cls-badge{background:rgba(255,255,255,.2);color:#fff}

  /* Grade badges */
  .grade{font-weight:800;padding:4px 12px;border-radius:14px;font-size:13px;display:inline-block;letter-spacing:.5px;line-height:1.3}
  .grade.a-plus{background:#FFE3D6;color:#E8643F;box-shadow:inset 0 0 0 1px rgba(232,100,63,.2)}
  .grade.a{background:#FFF1CC;color:#B88600;box-shadow:inset 0 0 0 1px rgba(255,200,61,.3)}
  .grade.a-minus{background:#D7EFD7;color:#3A8A3A;box-shadow:inset 0 0 0 1px rgba(95,184,95,.28)}
  .grade.b{background:#D6EBFB;color:#1A6FAA;box-shadow:inset 0 0 0 1px rgba(79,182,245,.3)}
  .grade.c{background:#FFE0DC;color:#C94A3A;box-shadow:inset 0 0 0 1px rgba(232,92,79,.25)}
  .grade.none{background:#F1E6D8;color:#9A8A7D}

  /* Student detail */
  .detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-weight:600;font-size:13px;padding:6px 10px;border-radius:10px;margin-bottom:16px}
  .detail-back:hover{background:#fff;color:var(--primary-dark)}
  .detail-hero{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .detail-avatar{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
  .detail-info .dn-name{font-size:22px;font-weight:900}
  .detail-info .dn-meta{font-size:13px;color:var(--text-muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .detail-stats{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
  .ds-chip{background:var(--surface-2);padding:10px 16px;border-radius:14px;min-width:92px;text-align:center}
  .ds-chip .ds-label{font-size:11px;color:var(--text-muted);font-weight:500}
  .ds-chip .ds-val{font-size:20px;font-weight:900;color:var(--primary-dark);margin-top:2px}
  .detail-charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  .detail-history{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  .small-table{width:100%;border-collapse:separate;border-spacing:0 4px}
  .small-table th{font-size:11px;color:var(--text-muted);font-weight:600;padding:4px 10px;text-align:left}
  .small-table td{padding:8px 10px;background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px}
  .small-table tr td:first-child{border-left:1px solid var(--border);border-radius:10px 0 0 10px}
  .small-table tr td:last-child{border-right:1px solid var(--border);border-radius:0 10px 10px 0}

  .hidden{display:none !important}
  .auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#FFF7F2 0%,#FFE8DC 100%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
  .auth-card{width:min(420px,90vw);background:#fff;border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow-lg);padding:28px 24px}
  .auth-title{font-size:28px;font-weight:900;margin-bottom:6px;color:var(--text)}
  .auth-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px}
  .auth-form{display:flex;flex-direction:column;gap:16px}
  .auth-field{display:flex;flex-direction:column;gap:8px}
  .auth-field label{font-size:12px;font-weight:700;color:var(--text-muted)}
  .auth-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-strong);background:#fff}
  .auth-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .auth-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
  .auth-tip{font-size:12px;color:var(--text-muted)}
  .muted{color:var(--text-muted)}
  .text-coral{color:var(--primary-dark)}
  .flex{display:flex}
  .gap-8{gap:8px}
  .gap-12{gap:12px}
  .items-center{align-items:center}
  .mt-8{margin-top:8px}
  .mt-16{margin-top:16px}
  .mb-0{margin-bottom:0}

  @media(max-width:1100px){
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .dash-grid{grid-template-columns:1fr}
    .charts-grid{grid-template-columns:1fr}
    .detail-charts{grid-template-columns:1fr}
    .detail-history{grid-template-columns:1fr}
    .field-3{grid-template-columns:1fr 1fr}
  }
  @media(max-width:760px){
    .sidebar{display:none}
    .topbar{padding:0 18px;flex-wrap:wrap;height:auto;padding-bottom:10px;padding-top:10px}
    .content{padding:18px}
    .stat-grid{grid-template-columns:1fr}

const apiUrl = (path) => `${API_BASE}${path}`;

  async checkSession() {
    try {
      const res = await fetch(apiUrl('/api/session'), { credentials: 'include' });
      const data = await res.json();
      return !!data.loggedIn;
    } catch (e) {
      return false;
    }
  },
  async login(username, password) {
    const res = await fetch(apiUrl('/api/login'), {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || '登录失败');
    return data;
  },
  async logout() {
    await fetch(apiUrl('/api/logout'), { method: 'POST', credentials: 'include' });
  },
  async loadData() {
    const res = await fetch(apiUrl('/api/data'), { credentials: 'include' });
    if (!res.ok) throw new Error('未登录或数据读取失败');
    return await res.json();
  },
  async saveData(payload) {
    const res = await fetch(apiUrl('/api/data'), {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || '保存失败');
    return data;
  },
};

function isLoggedIn(){
  return !!window.__loggedIn;
}
function setLoggedIn(flag){
  window.__loggedIn = !!flag;
  save(STORE.auth, { loggedIn: !!flag, username: flag ? LOGIN_USER : '' });
}
function showApp(){
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('authScreen').classList.add('hidden');
}
function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}
async function handleLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  try {
    await API.login(user, pass);
    setLoggedIn(true);
    const data = await API.loadData();
    db.students = data.students || [];

    db.points = data.points || [];
    showApp();
    render();
  } catch (err) {
    toast(err.message || '用户名或密码错误', 'error');

}

/* ---------- 示例数据 ---------- */
function seedIfEmpty(){
  if (db.students.length || db.homework.length || db.exams.length || db.points.length) return;
  const roster = Object.entries(STUDENT_ROSTER).flatMap(([classId, rows]) => rows.map((student, index) => ({
    id: `seed_${classId}_${String(student.studentId).padStart(3, '0')}`,
    name: student.name,
    studentId: String(student.studentId),
    gender: student.gender,
    region: student.region || '',
    note: '',
    classId,
    createdAt: Date.now() - index * 86400000,
  })));
  db.students = roster;
  db.homework = [];
  db.exams = [];
  db.points = [];
  persist();
  save(STORE.seeded, true);
}

async function bootstrapApp(){
  const loggedIn = await API.checkSession();
  setLoggedIn(loggedIn);
  if (!loggedIn) {
    showLogin();
    return;
  }
  try {
    const data = await API.loadData();
    db.students = data.students || [];
    db.homework = data.homework || [];
    db.exams = data.exams || [];
    db.points = data.points || [];
    if (!db.students.length && !db.homework.length && !db.exams.length && !db.points.length) {
      seedIfEmpty();
    }
    showApp();
    render();
  } catch (e) {
    seedIfEmpty();
    showApp();
    render();

}

const studentById = (id) => db.students.find(s=>s.id===id);
const pointsBalance = (studentId) => db.points.filter(p=>p.studentId===studentId).reduce((a,p)=>a + (p.type==='earn'?p.amount:-p.amount), 0);

/* 作业班级平均（按等级映射成数字，再算平均，最后换算成等级显示） */
const classHwAvgGrade = () => {
  const hws = classHomework();
  if(!hws.length) return null;
  let t=0, n=0;
  hws.forEach(h=> h.scores.forEach(s=>{ const v=gradeNum(s.grade); if(v!=null){t+=v;n++}}));
  if(!n) return null;
  const avg = t/n;
  // 按四舍五入映射到等级
  const nearest = GRADES.slice().sort((a,b)=> Math.abs(a.num-avg) - Math.abs(b.num-avg))[0];
  return {num: Math.round(avg*10)/10, grade: nearest.value};
};
/* 学生个人作业平均等级 */
const stuHwAvg = (sid) => {
  let t=0,n=0;
  classHomework().forEach(h=>{ const sc=h.scores.find(x=>x.studentId===sid); if(sc){ const v=gradeNum(sc.grade); if(v!=null){t+=v;n++}}});
  if(!n) return {num:null, grade:null};
  const avg = t/n;
  const nearest = GRADES.slice().sort((a,b)=> Math.abs(a.num-avg) - Math.abs(b.num-avg))[0];
  return {num: Math.round(avg*10)/10, grade: nearest.value};
};
/* 考试 */
const avgExam = () => { const all=[]; classExams().forEach(e=>e.scores.forEach(s=>all.push(s.score))); return all.length? Math.round(all.reduce((a,b)=>a+b,0)/all.length*10)/10 : 0; };
const stuExAvg = (sid) => { let t=0,n=0; classExams().forEach(e=>{const sc=e.scores.find(x=>x.studentId===sid);if(sc){t+=sc.score;n++}}); return n?Math.round(t/n*10)/10:'-'};
const totalPoints = () => classStudents().reduce((a,s)=>a+pointsBalance(s.id),0);
const fmtDate = (d) => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${m}/${dd}`; };

/* ---------- 路由 ---------- */
const VIEWS = [
  {key:'dashboard', name:'仪表盘', sub:'班级数据总览', icon:'dashboard'},
  {key:'students', name:'学生', sub:'学生信息管理', icon:'students'},
  {key:'homework', name:'作业', sub:'作业等级记录', icon:'homework'},
  {key:'exams', name:'考试', sub:'考试成绩记录', icon:'exam'},
  {key:'points', name:'积分', sub:'货币积分记录', icon:'points'},
  {key:'charts', name:'图表', sub:'数据分析与趋势', icon:'charts'},
];
let currentView = 'dashboard';
let detailStudentId = null; // 学生详情
let stuSearch = '';
let ptsFilter = 'all';
let chartsTab = 'perStudent'; // perStudent | classTrend | points

function setCurrent(v){ currentView=v; detailStudentId=null; chartsTab='perStudent'; ptsFilter='all'; render(); }

function classSwitchHTML(){
  const students = classStudents().length;
  return `<div class="class-switch">
    ${CLASSES.map(c=>{
      const cnt = db.students.filter(s=>s.classId===c.id).length;
      const active = c.id===currentClass;
      return `<button data-cls="${c.id}" class="${active?'active':''}">${c.name}<span class="cls-badge">${cnt}人</span></button>`;
    }).join('')}
  </div>`;
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = VIEWS.map(v=>`
    <button class="nav-item ${currentView===v.key?'active':''}" data-view="${v.key}">
      ${ico(v.icon,'nav-ico')}
      <span>${v.name}</span>
    </button>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(b=> b.onclick = ()=>{ currentView=b.dataset.view; detailStudentId=null; render(); });
}

function render(){
  renderNav();
  // 顶栏：左侧班级切换
  const titleArea = document.querySelector('.topbar .topbar-left');
  if(titleArea && !titleArea.querySelector('.class-switch')){
    const cs = document.createElement('div');
    cs.innerHTML = classSwitchHTML();
    titleArea.appendChild(cs);
  } else {
    const ex = document.querySelector('.topbar .class-switch');
    if(ex) ex.innerHTML = CLASSES.map(c=>{
      const cnt = db.students.filter(s=>s.classId===c.id).length;
      return `<button data-cls="${c.id}" class="${c.id===currentClass?'active':''}">${c.name}<span class="cls-badge">${cnt}人</span></button>`;
    }).join('');
  }
  document.querySelectorAll('.topbar .class-switch button').forEach(b=> b.onclick=()=>{
    currentClass = b.dataset.cls; saveClass(); detailStudentId=null; render();
    toast(`已切换至 ${classNameFor(currentClass)}`,'info');
  });

  const sub = VIEWS.find(v=>v.key===currentView);
  let title = sub.name;
  let pageSub = sub.sub;
  if (detailStudentId && currentView==='students'){
    const s = studentById(detailStudentId);
    title = s? s.name : sub.name;
    pageSub = s? `${s.studentId} · 个人分析` : sub.sub;
  }
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = pageSub;

  const content = document.getElementById('content');
  content.innerHTML = '';
  const topActions = document.getElementById('topActions');
  topActions.innerHTML = '';
  if (isLoggedIn()) {
    topActions.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="logout()">${ico('close')}退出登录</button>`;
  }

  if (currentView==='students' && detailStudentId){
    renderStudentDetail(content, topActions);
  } else if (currentView==='dashboard') renderDashboard(content, topActions);
  else if (currentView==='students') renderStudents(content, topActions);
  else if (currentView==='homework') renderHomework(content, topActions);
  else if (currentView==='exams') renderExams(content, topActions);
  else if (currentView==='points') renderPoints(content, topActions);
  else if (currentView==='charts') renderCharts(content, topActions);
}

/* ===================== 仪表盘 ===================== */
function renderDashboard(c, top){
  top.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="setCurrent('students')">${ico('user')}学生管理</button>`;
  const hw = classHwAvgGrade();
  const avgEx = avgExam();
  const totalP = totalPoints();
  const totalS = classStudents().length;

  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card coral">
        <div class="stat-ico">${ico('user')}</div>
        <div class="stat-label">学生总数</div>
        <div class="stat-value">${totalS}</div>
        <div class="stat-trend flat">${classNameFor(currentClass)}</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-ico">${ico('homework')}</div>
        <div class="stat-label">作业平均等级</div>
        <div class="stat-value">${hw? gradeBadge(hw.grade).replace('padding:4px 12px','padding:6px 14px;font-size:24px') : '<span class="muted" style="font-size:18px">—</span>'}</div>
        <div class="stat-trend up">${ico('trend')} ${hw? hw.num+' (数值化平均)': '暂无数据'}</div>
      </div>
      <div class="stat-card mint">
        <div class="stat-ico">${ico('exam')}</div>
        <div class="stat-label">考试平均分</div>
        <div class="stat-value">${avgEx}</div>
        <div class="stat-trend up">${ico('trend')} 历次考试平均</div>
      </div>
      <div class="stat-card sky">
        <div class="stat-ico">${ico('star')}</div>
        <div class="stat-label">累计积分</div>
        <div class="stat-value">${totalP}</div>
        <div class="stat-trend up">${ico('coin')} 班级积分总量</div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="card card-pad">
        <div class="section-head">
          <div><div class="section-title">班级成绩趋势</div><div class="section-sub">作业平均等级(数值) 与 考试平均分</div></div>
          <button class="btn btn-icon" onclick="setCurrent('charts')">${ico('trend')}</button>
        </div>
        <div class="chart-box"><canvas id="dashChart"></canvas></div>
      </div>
      <div class="card card-pad">
        <div class="section-head"><div class="section-title">最近动态</div><div class="section-sub">积分与成绩记录</div></div>
        <div class="recent-list" id="recentList"></div>
      </div>
    </div>
  `;

  const hwSorted = [...classHomework()].sort((a,b)=>a.date.localeCompare(b.date));
  const exSorted = [...classExams()].sort((a,b)=>a.date.localeCompare(b.date));
  const allDates = Array.from(new Set([...hwSorted.map(h=>h.date), ...exSorted.map(e=>e.date)])).sort();
  const labels = allDates.map(d=>fmtDate(d));
  const hwAt = (date) => { const r=hwSorted.find(x=>x.date===date); if(!r||!r.scores.length) return null; let t=0,n=0; r.scores.forEach(s=>{const v=gradeNum(s.grade);if(v!=null){t+=v;n++}}); return n? Math.round(t/n*10)/10 : null; };
  const exAt = (date) => { const r=exSorted.find(x=>x.date===date); if(!r||!r.scores.length) return null; return Math.round(r.scores.reduce((a,s)=>a+s.score,0)/r.scores.length*10)/10; };
  new Chart(document.getElementById('dashChart'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'作业平均(数值)', data:allDates.map(hwAt), borderColor:'#FF8A65', backgroundColor:'rgba(255,138,101,.12)', tension:.4, fill:true, pointBackgroundColor:'#FF8A65', pointRadius:5, pointHoverRadius:7, borderWidth:3, spanGaps:true, yAxisID:'y'},
      {label:'考试平均(分数)', data:allDates.map(exAt), borderColor:'#4FB6F5', backgroundColor:'rgba(79,182,245,.12)', tension:.4, fill:true, pointBackgroundColor:'#4FB6F5', pointRadius:5, pointHoverRadius:7, borderWidth:3, spanGaps:true, yAxisID:'y1'}
    ]},
    options:{...chartOpts(true), scales:{
      x:{grid:{display:false},ticks:{color:'#9A8A7D',font:{size:11}}},
      y:{position:'left',grid:{color:'#F1E6D8'},ticks:{color:'#9A8A7D',font:{size:11}},title:{display:true,text:'等级(1-5)',color:'#9A8A7D',font:{size:11}}},
      y1:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#9A8A7D',font:{size:11}},title:{display:true,text:'分数(0-100)',color:'#9A8A7D',font:{size:11}}}
    }}
  });

  const recent = [];
  classPoints().slice(-5).reverse().forEach(p=>{ const s=studentById(p.studentId); if(s) recent.push({type:'points', name:s.name, avatar:colorFor(s.name), desc:(p.type==='earn'?'+':'-')+p.amount+' 积分 · '+p.reason, time:p.date}); });
  classExams().slice(-2).reverse().forEach(e=>{ const a = Math.round(e.scores.reduce((a,s)=>a+s.score,0)/e.scores.length*10)/10; recent.push({type:'exam', name:e.name, avatar:'#5FB85F', desc:'考试记录 · 平均 '+a+'分', time:e.date}); });
  classHomework().slice(-3).reverse().forEach(h=>{ let t=0,n=0; h.scores.forEach(s=>{const v=gradeNum(s.grade);if(v!=null){t+=v;n++}}); const a = n? GRADES.slice().sort((a,b)=>Math.abs(a.num-t/n)-Math.abs(b.num-t/n))[0].value : '-'; recent.push({type:'hw', name:h.name, avatar:'#FFC83D', desc:'作业记录 · 平均等级 '+a, time:h.date}); });
  recent.sort((a,b)=>(b.time||'').localeCompare(a.time||''));
  const list = document.getElementById('recentList');
  list.innerHTML = recent.slice(0,7).map(r=>`
    <div class="recent-item">
      <div class="recent-avatar" style="background:${r.avatar}">${r.name.slice(0,1)}</div>
      <div class="recent-body"><div class="recent-name">${r.name}</div><div class="recent-desc">${r.desc}</div></div>
      <div class="recent-time">${fmtDate(r.time)}</div>
    </div>
  `).join('') || `<div class="empty"><div>暂无动态</div></div>`;
}

/* ===================== 学生列表 ===================== */
function renderStudents(c, top){
  top.innerHTML = `<button class="btn btn-primary" onclick="openStudentModal()">${ico('plus')}添加学生</button>`;
  const students = classStudents();
  const list = students.filter(s=> !stuSearch || s.name.includes(stuSearch) || s.studentId.includes(stuSearch));
  c.innerHTML = `
    <div class="card card-pad">
      <div class="toolbar">
        <div class="search-box">${ico('search')}<input id="stuSearchInput" placeholder="搜索学生姓名 / 学号" value="${stuSearch}" /></div>
        <div class="muted" style="font-size:12px">共 ${list.length} 名学生 · ${classNameFor(currentClass)}</div>
      </div>
      ${list.length===0 ? emptyState('students','还没有学生，点击「添加学生」开始记录') : `
      <table class="table">
        <thead><tr><th>学生</th><th>学号</th><th>区域</th><th>性别</th><th>作业等级</th><th>考试均分</th><th>积分余额</th><th>操作</th></tr></thead>
        <tbody>
          ${list.map(s=>{
            const hw = stuHwAvg(s.id);
            const ex = stuExAvg(s.id);
            const bal = pointsBalance(s.id);
            return `<tr>
              <td><div class="stu-cell"><div class="stu-avatar" style="background:${colorFor(s.name)}">${s.name.slice(-2,-1)||s.name.slice(0,1)}</div><div><div class="stu-name stu-name-link" onclick="openDetail('${s.id}')" title="查看详情">${s.name}</div><div class="stu-id">${s.note||''}</div></div></div></td>
              <td class="muted">${s.studentId}</td>
              <td class="muted">${s.region || '—'}</td>
              <td><span class="gender-tag ${s.gender==='男'?'gender-male':'gender-female'}">${s.gender}</span></td>
              <td>${hw.grade? gradeBadge(hw.grade)+` <span class="muted" style="font-size:11px">(${hw.num})</span>` : '<span class="muted">—</span>'}</td>
              <td>${ex=== '-'?'<span class="muted">—</span>':`<b class="text-coral">${ex}</b>`}</td>
              <td><span class="points-badge">${bal}</span></td>
              <td><div class="row-actions">
                <button class="btn btn-icon" onclick="openDetail('${s.id}')" title="查看详情">${ico('eye')}</button>
                <button class="btn btn-icon" onclick="openStudentModal('${s.id}')" title="编辑">${ico('edit')}</button>
                <button class="btn btn-icon" onclick="deleteStudent('${s.id}')" title="删除">${ico('trash')}</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  const inp = document.getElementById('stuSearchInput');
  if(inp){ inp.oninput = (e)=>{ stuSearch = e.target.value; renderStudents(document.getElementById('content'), document.getElementById('topActions')); document.getElementById('stuSearchInput').focus(); }; }
}

function renderStuHwTable(sid){
  const rows = [...classHomework()].sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length) return `<div class="muted" style="font-size:12px;padding:10px">暂无作业记录</div>`;
  return `<table class="small-table"><thead><tr><th>作业</th><th>日期</th><th>等级</th><th>备注</th></tr></thead><tbody>
    ${rows.map(h=>{const sc=h.scores.find(x=>x.studentId===sid); return `<tr><td>${h.name}</td><td class="muted">${fmtDate(h.date)}</td><td>${sc? gradeBadge(sc.grade):'<span class="muted">缺勤</span>'}</td><td class="muted">${sc?.note||'—'}</td></tr>`}).join('')}
  </tbody></table>`;
}
function renderStuExTable(sid){
  const rows = [...classExams()].sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length) return `<div class="muted" style="font-size:12px;padding:10px">暂无考试记录</div>`;
  return `<table class="small-table"><thead><tr><th>考试</th><th>日期</th><th>分数</th><th>备注</th></tr></thead><tbody>
    ${rows.map(e=>{const sc=e.scores.find(x=>x.studentId===sid); return `<tr><td>${e.name}</td><td class="muted">${fmtDate(e.date)}</td><td>${sc? `<b class="text-coral">${sc.score}</b>/${e.total}`:'<span class="muted">缺勤</span>'}</td><td class="muted">${sc?.note||'—'}</td></tr>`}).join('')}
  </tbody></table>`;
}

function openStudentModal(id){
  const s = id? studentById(id) : {name:'',studentId:'',gender:'男',region:'',note:'', classId: currentClass};
  modalOpen(id?'编辑学生':'添加学生', `
    <div class="field"><label class="field-label">姓名<span class="req">*</span></label><input id="f_name" value="${s.name}" placeholder="如：李子涵" /></div>
    <div class="field-row">
      <div class="field"><label class="field-label">学号</label><input id="f_sid" value="${s.studentId}" placeholder="如：1" /></div>
      <div class="field"><label class="field-label">性别</label>
        <select id="f_gender"><option value="男" ${s.gender==='男'?'selected':''}>男</option><option value="女" ${s.gender==='女'?'selected':''}>女</option></select>
      </div>
    </div>
    <div class="field"><label class="field-label">区域</label><input id="f_region" value="${s.region||''}" placeholder="如：东 / 南 / 西 / 北" /></div>
    <div class="field"><label class="field-label">所属班级<span class="req">*</span></label>
      <select id="f_class">${CLASSES.map(c=>`<option value="${c.id}" ${s.classId===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
    </div>
    <div class="field"><label class="field-label">备注</label><input id="f_note" value="${s.note||''}" placeholder="如：班长 / 联系方式" /></div>
  `, ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('请输入学生姓名','error'); return false; }

      name, studentId: document.getElementById('f_sid').value.trim(),
      gender: document.getElementById('f_gender').value,
      region: document.getElementById('f_region').value.trim(),
      classId: document.getElementById('f_class').value,
      note: document.getElementById('f_note').value.trim(),
    };
    if(id){ Object.assign(s, data); } else { db.students.push({id:uid(), ...data, createdAt:Date.now()}); }
    persist(); toast(id?'已更新学生信息':'已添加学生','success'); render();
    return true;
  });
}

function deleteStudent(id){
  const s = studentById(id);
  confirmOpen(`删除学生「${s.name}」？`, '该学生的作业、考试、积分记录将一并删除，此操作不可撤销。', ()=>{

/* ===================== 作业（等级制） ===================== */
function renderHomework(c, top){
  top.innerHTML = `<button class="btn btn-primary" onclick="openRecordModal('homework')">${ico('plus')}新建作业记录</button>`;
  const sorted = [...classHomework()].sort((a,b)=>b.date.localeCompare(a.date));
  c.innerHTML = `<div class="record-list">${
    sorted.length? sorted.map(h=>{
      // 平均等级
      let t=0,n=0; h.scores.forEach(s=>{const v=gradeNum(s.grade);if(v!=null){t+=v;n++}});
      const avgG = n? GRADES.slice().sort((a,b)=>Math.abs(a.num-t/n)-Math.abs(b.num-t/n))[0] : null;
      // 各等级分布
      const dist = {}; GRADES.forEach(g=>dist[g.value]=0); h.scores.forEach(s=>{if(dist[s.grade]!=null)dist[s.grade]++});
      return `<div class="record-card">
        <div class="record-ico" style="background:#FFC83D">${ico('homework')}</div>
        <div class="record-info">
          <div class="record-name">${h.name}</div>
          <div class="record-meta"><span>${ico('calendar')}<span style="margin-left:4px">${h.date}</span></span><span>参与 ${h.scores.length} 人</span>
            <span>${GRADES.map(g=>dist[g.value]?`<b>${g.value}</b>×${dist[g.value]}`:'').filter(Boolean).join(' ')}</span>
          </div>
        </div>
        <div style="text-align:center"><div class="record-stat">平均 ${avgG? gradeBadge(avgG.value):'<span class="muted">—</span>'}</div></div>
        <div class="row-actions" style="align-items:center">
          <button class="btn btn-soft btn-sm" onclick="openRecordModal('homework','${h.id}')">${ico('edit')}编辑</button>
          <button class="btn btn-icon" onclick="deleteRecord('homework','${h.id}')">${ico('trash')}</button>
        </div>
      </div>`;
    }).join('') : emptyState('homework','还没有作业记录，点击「新建作业记录」开始')
  }</div>`;
}

/* ===================== 考试（分数制） ===================== */
function renderExams(c, top){
  top.innerHTML = `<button class="btn btn-primary" onclick="openRecordModal('exam')">${ico('plus')}新建考试记录</button>`;
  const sorted = [...classExams()].sort((a,b)=>b.date.localeCompare(a.date));

    sorted.length? sorted.map(e=>{
      const avg = e.scores.length? Math.round(e.scores.reduce((a,s)=>a+s.score,0)/e.scores.length*10)/10 : 0;

          <div class="record-meta"><span>${ico('calendar')}<span style="margin-left:4px">${e.date}</span></span><span>满分 ${e.total}</span><span>参与 ${e.scores.length} 人</span></div>
        </div>
        <div style="text-align:center"><div class="record-stat">平均 <b>${avg}</b></div><div class="record-meta" style="justify-content:center">最高 ${max} · 最低 ${min}</div></div>
        <div class="row-actions" style="align-items:center">

/* ---------- 录入弹窗 ---------- */
function openRecordModal(type, id){
  const isHw = type==='homework';
  const store = isHw? db.homework : db.exams;
  const students = classStudents();
  const r = id? store.find(x=>x.id===id) : (isHw
    ? {name:'',date:new Date().toISOString().slice(0,10),classId:currentClass,scores:students.map(s=>({studentId:s.id, grade:'', note:''}))}
    : {name:'',date:new Date().toISOString().slice(0,10),total:100,classId:currentClass,scores:students.map(s=>({studentId:s.id, score:'', note:''}))}
  );
  const today = new Date().toISOString().slice(0,10);
  const date = r.date || today;
  const totalField = isHw ? '' : `<div class="field" style="max-width:120px"><label class="field-label">满分</label><input id="r_total" type="number" value="${r.total||100}" /></div>`;
  const gridRows = students.map(s=>{
    if(isHw){
      const sc = r.scores.find(x=>x.studentId===s.id) || {grade:'',note:''};
      return `<div class="score-row">
        <div class="stu-avatar" style="background:${colorFor(s.name)}">${s.name.slice(-2,-1)||s.name.slice(0,1)}</div>
        <div class="sr-name">${s.name}</div>
        <select class="sr-input grade-sel" data-sid="${s.id}">
          <option value="">缺勤</option>
          ${GRADES.map(g=>`<option value="${g.value}" ${sc.grade===g.value?'selected':''}>${g.label}</option>`).join('')}
        </select>
        <input class="sr-note" data-sid="${s.id}" value="${sc.note||''}" placeholder="备注" />
      </div>`;
    } else {
      const sc = r.scores.find(x=>x.studentId===s.id) || {score:'',note:''};
      return `<div class="score-row">
        <div class="stu-avatar" style="background:${colorFor(s.name)}">${s.name.slice(-2,-1)||s.name.slice(0,1)}</div>
        <div class="sr-name">${s.name}</div>
        <input class="sr-input" data-sid="${s.id}" type="number" value="${sc.score}" placeholder="缺勤" />
        <input class="sr-note" data-sid="${s.id}" value="${sc.note||''}" placeholder="备注" />
      </div>`;
    }
  }).join('');
  modalOpen(id?'编辑'+(isHw?'作业':'考试'):'新建'+(isHw?'作业':'考试')+'记录', `
    <div class="field-3">
      <div class="field"><label class="field-label">名称<span class="req">*</span></label><input id="r_name" value="${r.name}" placeholder="${isHw?'如：口算练习·第四单元':'如：第三单元测试'}" /></div>
      <div class="field"><label class="field-label">日期</label><input id="r_date" type="date" value="${date}" /></div>
      ${totalField || '<div></div>'}
    </div>
    <div class="field">
      <label class="field-label">学生成绩 <span class="muted" style="font-weight:400">（留空为缺勤）</span></label>
      <div class="score-grid" id="scoreGrid">${gridRows}</div>
    </div>
  `, ()=>{
    const name = document.getElementById('r_name').value.trim();
    if(!name){ toast('请输入名称','error'); return false; }
    const dateVal = document.getElementById('r_date').value || today;
    let scores;
    if(isHw){
      scores = students.map(s=>{
        const sel = document.querySelector(`.grade-sel[data-sid="${s.id}"]`);
        const note = document.querySelector(`.sr-note[data-sid="${s.id}"]`).value.trim();
        return { studentId:s.id, grade: sel.value || null, note };
      }).filter(x=>x.grade!==null);
    } else {
      const total = +document.getElementById('r_total').value || 100;
      scores = students.map(s=>{
        const inp = document.querySelector(`.sr-input:not(.grade-sel)[data-sid="${s.id}"]`);
        const note = document.querySelector(`.sr-note[data-sid="${s.id}"]`).value.trim();
        const val = inp.value.trim();
        return { studentId:s.id, score: val===''?null:Math.max(0,Math.min(total,+val)), note };
      }).filter(x=>x.score!==null);
    }
    const data = { name, date:dateVal, classId:currentClass, scores };
    if(!isHw) data.total = +document.getElementById('r_total').value || 100;
    if(id){ Object.assign(r, data); } else { store.push({id:uid(), ...data}); }
    persist(); toast(id?'已更新记录':'已保存记录','success'); render();
    return true;
  });
}

function deleteRecord(type, id){
  const isHw = type==='homework';
  const store = isHw? db.homework : db.exams;
  const r = store.find(x=>x.id===id);
  confirmOpen(`删除「${r.name}」？`, '该记录及其所有学生成绩将被删除，不可撤销。', ()=>{
    if(isHw) db.homework = db.homework.filter(x=>x.id!==id);
    else db.exams = db.exams.filter(x=>x.id!==id);
    persist(); toast('已删除','success'); render();
  });
}

/* ===================== 图表分析 ===================== */
function renderCharts(c, top){
  c.innerHTML = `
    <div class="tabs" id="chartsTabs">
      <button class="tab ${chartsTab==='perStudent'?'active':''}" data-t="perStudent">学生个体</button>
      <button class="tab ${chartsTab==='classTrend'?'active':''}" data-t="classTrend">班级趋势</button>
      <button class="tab ${chartsTab==='points'?'active':''}" data-t="points">积分累计</button>
    </div>
    <div id="chartsArea"></div>
  `;
  document.querySelectorAll('#chartsTabs .tab').forEach(b=> b.onclick=()=>{ chartsTab=b.dataset.t; renderCharts(c,top); });
  drawCharts();
}

function drawCharts(){
  const area = document.getElementById('chartsArea');
  if(!area) return;
  const students = classStudents();
  if(chartsTab==='perStudent'){
    const def = students[0]?.id || '';
    area.innerHTML = `<div class="card card-pad">
      <div class="section-head">
        <div><div class="section-title">学生个人分析</div><div class="section-sub">作业等级折线 + 考试分数折线</div></div>
        <select id="chStuSel" style="padding:8px 14px;border-radius:10px;border:1px solid var(--border-strong);font-weight:600">${students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
      </div>
      <div class="detail-charts" style="margin:0">
        <div class="chart-box" style="height:320px"><canvas id="ch_sh"></canvas></div>
        <div class="chart-box" style="height:320px"><canvas id="ch_se"></canvas></div>
      </div>
    </div>`;
    const sel = document.getElementById('chStuSel');
    sel.value = def;
    const drawPer = (sid)=>{
      const s = studentById(sid); if(!s) return;
      const hwSorted = [...classHomework()].sort((a,b)=>a.date.localeCompare(b.date));
      const exSorted = [...classExams()].sort((a,b)=>a.date.localeCompare(b.date));
      if(window._ch_sh) window._ch_sh.destroy();
      if(window._ch_se) window._ch_se.destroy();
      window._ch_sh = new Chart(document.getElementById('ch_sh'), {
        type:'line',
        data:{labels:hwSorted.map(h=>h.name.length>8?h.name.slice(0,7)+'…':h.name), datasets:[{label:s.name+' 作业等级', data:hwSorted.map(h=>{const sc=h.scores.find(x=>x.studentId===sid);return sc?gradeNum(sc.grade):null;}), borderColor:'#FF8A65', backgroundColor:'rgba(255,138,101,.15)', tension:.4, fill:true, pointBackgroundColor:'#FF8A65', pointRadius:6, borderWidth:3, spanGaps:true}]},
        options:{...chartOpts(true), scales:{x:{grid:{display:false},ticks:{color:'#9A8A7D',font:{size:11}}}, y:{min:0,max:6, ticks:{stepSize:1,color:'#9A8A7D',font:{size:11},callback:v=>{const g=gradeByNum(v);return g?g.value:'';}}, grid:{color:'#F1E6D8'}}}}
      });
      window._ch_se = new Chart(document.getElementById('ch_se'), {
        type:'line',
        data:{labels:exSorted.map(e=>e.name.length>8?e.name.slice(0,7)+'…':e.name), datasets:[{label:s.name+' 考试分数', data:exSorted.map(e=>{const sc=e.scores.find(x=>x.studentId===sid);return sc?sc.score:null;}), borderColor:'#4FB6F5', backgroundColor:'rgba(79,182,245,.15)', tension:.4, fill:true, pointBackgroundColor:'#4FB6F5', pointRadius:6, borderWidth:3, spanGaps:true}]},
        options:chartOpts(true)
      });
    };
    drawPer(def);
    sel.onchange = ()=> drawPer(sel.value);
  } else if(chartsTab==='classTrend'){
    area.innerHTML = `<div class="charts-grid">
      <div class="card chart-card"><div class="section-head"><div><div class="section-title">班级作业平均等级</div><div class="section-sub">历次作业班级等级均值(数值)</div></div></div><div class="chart-box"><canvas id="ch_hw"></canvas></div></div>
      <div class="card chart-card"><div class="section-head"><div><div class="section-title">班级考试平均分数</div><div class="section-sub">历次考试班级平均分</div></div></div><div class="chart-box"><canvas id="ch_ex"></canvas></div></div>
    </div>`;
    const hwSorted=[...classHomework()].sort((a,b)=>a.date.localeCompare(b.date));
    const exSorted=[...classExams()].sort((a,b)=>a.date.localeCompare(b.date));
    new Chart(document.getElementById('ch_hw'),{type:'line',data:{labels:hwSorted.map(h=>h.name.length>10?h.name.slice(0,9)+'…':h.name),datasets:[{label:'平均等级(数值)',data:hwSorted.map(h=>{let t=0,n=0;h.scores.forEach(s=>{const v=gradeNum(s.grade);if(v!=null){t+=v;n++}});return n?Math.round(t/n*10)/10:null;}),borderColor:'#FF8A65',backgroundColor:'rgba(255,138,101,.14)',tension:.4,fill:true,pointBackgroundColor:'#FF8A65',pointRadius:5,borderWidth:3,spanGaps:true}]},options:{...chartOpts(true), scales:{x:{grid:{display:false},ticks:{color:'#9A8A7D',font:{size:11}}}, y:{min:0,max:6, ticks:{stepSize:1,color:'#9A8A7D',font:{size:11},callback:v=>{const g=gradeByNum(v);return g?g.value:'';}}, grid:{color:'#F1E6D8'}}}}});
    new Chart(document.getElementById('ch_ex'),{type:'line',data:{labels:exSorted.map(e=>e.name.length>10?e.name.slice(0,9)+'…':e.name),datasets:[{label:'考试平均分',data:exSorted.map(e=>Math.round(e.scores.reduce((a,s)=>a+s.score,0)/e.scores.length*10)/10),borderColor:'#5FB85F',backgroundColor:'rgba(95,184,95,.14)',tension:.4,fill:true,pointBackgroundColor:'#5FB85F',pointRadius:5,borderWidth:3,spanGaps:true}]},options:chartOpts(true)});
  } else { // points
    area.innerHTML = `<div class="card chart-card"><div class="section-head"><div><div class="section-title">学生积分累计趋势</div><div class="section-sub">选择学生查看积分变化曲线</div></div>
      <select id="ptsStuSel" style="padding:8px 12px;border-radius:10px;border:1px solid var(--border-strong)">${students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
      <div class="chart-box"><canvas id="ch_pts"></canvas></div></div>`;
    const sel = document.getElementById('ptsStuSel');
    const drawPts = (sid)=>{
      const recs = db.points.filter(p=>p.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date));
      let bal=0; const labels=['起始']; const data=[0];
      recs.forEach(p=>{ bal += p.type==='earn'?p.amount:-p.amount; labels.push(p.reason||p.date); data.push(bal); });
      const s = studentById(sid);
      if(window._ptsChart) window._ptsChart.destroy();
      window._ptsChart = new Chart(document.getElementById('ch_pts'),{type:'line',data:{labels:labels.map(l=>(l||'').length>8?l.slice(0,7)+'…':l),datasets:[{label:(s?.name||'')+' 积分余额',data,borderColor:'#4FB6F5',backgroundColor:'rgba(79,182,245,.14)',tension:.35,fill:true,pointBackgroundColor:'#4FB6F5',pointRadius:4,borderWidth:3}]},options:chartOpts(true)});
    };
    drawPts(students[0]?.id);
    sel.onchange = ()=> drawPts(sel.value);
  }
}

function chartOpts(legend){
  return {
    responsive:true, maintainAspectRatio:false,
    layout:{ padding:{top:14, right:16, bottom:8, left:8} },
    elements:{ line:{ tension:.4 }, point:{ hoverRadius:7 } },
    plugins:{
      legend:{ display:!!legend, position:'top', align:'end', labels:{boxWidth:12,boxHeight:12,padding:14,font:{size:12,family:'Noto Sans SC'},color:'#4A3F38'} },
      tooltip:{ backgroundColor:'#4A3F38', titleFont:{size:13}, bodyFont:{size:12}, padding:12, cornerRadius:10, displayColors:true, boxPadding:4, padding:12 }
    },
    scales:{
      x:{ grid:{display:false}, ticks:{color:'#9A8A7D',font:{size:11}, padding:8} },
      y:{ beginAtZero:false, grid:{color:'#F1E6D8'}, ticks:{color:'#9A8A7D',font:{size:11}, padding:8} }
    },
    interaction:{intersect:false,mode:'index'},
    clip:false,
  };
}

/* ===================== 通用 UI ===================== */
function emptyState(type, msg){ return `<div class="empty"><div class="empty-ico">${ico(type)}</div><div>${msg}</div></div>`; }

let modalEl = null;
function modalOpen(title, bodyHtml, onConfirm){
  closeModal();
  const ov = document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-head"><div class="modal-title">${title}</div><button class="btn btn-icon" onclick="closeModal()">${ico('close')}</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalOk">${ico('check')}保存</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  modalEl = ov;
  ov.addEventListener('click',(e)=>{ if(e.target===ov) closeModal(); });
  document.getElementById('modalOk').onclick = ()=>{ const r = onConfirm(); if(r!==false) closeModal(); };
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }

function confirmOpen(title, msg, onOk){
  closeModal();
  const ov = document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal" style="max-width:420px">
    <div class="modal-head" style="padding-bottom:0"><div class="modal-title">${title}</div></div>
    <div class="modal-body"><div class="muted" style="font-size:13px;line-height:1.6">${msg}</div></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" id="cfOk">${ico('trash')}确认删除</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  modalEl = ov;
  ov.addEventListener('click',(e)=>{ if(e.target===ov) closeModal(); });
  document.getElementById('cfOk').onclick = ()=>{ closeModal(); onOk(); };
}

function toast(msg, type='info'){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<div class="toast-ico">${ico(type==='success'?'check':type==='error'?'close':'bell')}</div><div class="toast-msg">${msg}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='all .3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------- 启动 ---------- */
document.getElementById('loginBtn').onclick = handleLogin;
document.getElementById('loginPass').addEventListener('keydown',(e)=>{ if(e.key==='Enter') handleLogin(); });
bootstrapApp();
</script>
